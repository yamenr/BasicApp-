plugins {
    id 'com.android.application'
    // Reads app/google-services.json so the app knows which Firebase project to use
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.restaurantadmin'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.restaurantadmin"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Android basics
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.5'

    // Firebase (the BoM picks matching versions for all Firebase libraries)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // Glide loads images from a URL into an ImageView
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}

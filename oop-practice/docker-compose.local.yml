# Run the app on your own computer (no server, no HTTPS):
#   docker compose -f docker-compose.local.yml up --build
# Then open http://localhost:3000
# Needs a .env file next to this one with GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and ADMIN_EMAILS.
name: oop-practice-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oop
      POSTGRES_USER: oop
      POSTGRES_PASSWORD: oop
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oop -d oop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://oop:oop@db:5432/oop
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-development-only
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS in .env}

volumes:
  db-data:
